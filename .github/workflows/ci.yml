name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: House rules
        run: npm run check:rules
      - name: Design copy and fixtures match the canvas
        run: npm run check:sync
      - name: Board lint and state manifest
        run: npm run canvas:lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Generated TypeScript contracts are committed
        run: node tools/check-contracts.mjs
  state-gate:
    # Required: every board state whose click path is marked "checked" must reach and match its board (GATE=checked).
    # The full report (all states, drafts included) is uploaded as an artifact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The harness drives the dev server, as locally: S35 offline uses the dev-only ?sim=offline
      # simulation (apps/web/src/data/sim.ts). The production bundle is built and checked in the web job.
      - name: State gate (checked click paths, required)
        run: |
          npm run dev -w @spekin/web &
          npx --yes wait-on@8 http://127.0.0.1:5173/ --timeout 60000
          # Warm the dev server: compile every screen's modules once before the timed click paths run.
          for r in / /p/meranti-yard/design; do curl -s -o /dev/null http://127.0.0.1:5173$r; done
          GATE=checked npm run harness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: state-gate
          path: tools/harness/out

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Spekin architecture clarity — proposed explanation, not runtime</title><desc id="desc">Flat first logical responsibilities, optional isometric projection of identical nodes, then selected component detail and traceable evidence. No deployed architecture or new feature is claimed.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#81776c"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#302e2a}.small{font-size:15px;fill:#6d675f}.label{font-size:18px;font-weight:600}.mono{font-family:'JetBrains Mono',monospace;font-size:14px}.line{fill:none;stroke:#81776c;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1200" height="920" fill="#FAF9F5"/><text x="48" y="48" class="small">SPEKIN / EXPLANATORY CONCEPT · OPTIONAL, NOT AN ACCEPTED NEW FEATURE</text><text x="48" y="94" font-size="34" font-weight="650">One architecture artifact. Different levels of clarity.</text><text x="48" y="130" class="small">Illustrative logical responsibilities only. Not inspected code, deployment topology or runtime evidence.</text><rect x="48" y="160" width="1104" height="64" rx="8" fill="#eeece6"/><text x="66" y="186" class="label">Existing stage shell → architecture / contract artifact</text><text x="66" y="211" class="small">No ninth stage · same project/revision · proposed / accepted-design / imported / observed-build stay distinct</text><rect x="48" y="248" width="650" height="392" rx="10" fill="none" stroke="#d3cec5"/><text x="68" y="281" class="label">01 / Flat first</text><text x="68" y="307" class="small">Select a responsibility. Read its contract and reason.</text><rect x="74" y="358" width="144" height="74" rx="8" fill="#eeece6" stroke="#a49c91"/><text x="89" y="389" class="label">Browser UI</text><text x="89" y="414" class="mono">C-ui · TS/JS</text><rect x="270" y="340" width="218" height="114" rx="8" fill="#f0e5dc" stroke="#B4532A" stroke-width="2"/><text x="288" y="372" class="label">Rust authority</text><text x="288" y="398" class="small">proposals · permissions</text><text x="288" y="422" class="small">jobs · ledger</text><text x="288" y="445" class="mono">C-core · SELECTED</text><rect x="540" y="358" width="132" height="74" rx="8" fill="#eeece6" stroke="#a49c91"/><text x="555" y="388" class="label">Data</text><text x="555" y="414" class="mono">C-data</text><rect x="286" y="520" width="190" height="70" rx="8" fill="#eeece6" stroke="#a49c91"/><text x="303" y="549" class="label">Provider APIs</text><text x="303" y="573" class="mono">C-provider</text><path d="M218 394H266" class="line"/><path d="M488 394H536" class="line"/><path d="M380 454V515" class="line"/><text x="395" y="490" class="small">authorized calls</text><text x="68" y="620" class="small">Boxes are responsibilities, not a mandate for separate services/databases.</text><rect x="724" y="248" width="428" height="392" rx="10" fill="none" stroke="#d3cec5"/><text x="744" y="281" class="label">02 / Optional projection</text><text x="744" y="307" class="small">Same IDs, edges, revision and selection.</text><g stroke="#9a9085" stroke-width="1.5"><path d="M772 411l51-24 51 24-51 25z" fill="#eeece6"/><path d="M772 411v34l51 25v-34z" fill="#e2ded6"/><path d="M823 436l51-25v34l-51 25z" fill="#d3cdc3"/><path d="M880 352l60-28 60 28-60 28z" fill="#f0e5dc" stroke="#B4532A"/><path d="M880 352v42l60 28v-42z" fill="#e6d3c4" stroke="#B4532A"/><path d="M940 380l60-28v42l-60 28z" fill="#d7bbab" stroke="#B4532A"/><path d="M1021 412l51-24 51 24-51 25z" fill="#eeece6"/><path d="M1021 412v34l51 25v-34z" fill="#e2ded6"/><path d="M1072 437l51-25v34l-51 25z" fill="#d3cdc3"/><path d="M889 534l51-24 51 24-51 25z" fill="#eeece6"/><path d="M889 534v34l51 25v-34z" fill="#e2ded6"/><path d="M940 559l51-25v34l-51 25z" fill="#d3cdc3"/></g><path d="M850 385L879 371" class="line"/><path d="M1000 380L1033 397" class="line"/><path d="M940 425V505" class="line"/><text x="792" y="489" class="mono">C-ui</text><text x="903" y="447" class="mono">C-core</text><text x="1040" y="490" class="mono">C-data</text><text x="892" y="614" class="mono">C-provider</text><rect x="48" y="668" width="1104" height="188" rx="10" fill="#eeece6"/><text x="68" y="700" class="label">03 / Selected detail → requirement → contract/state → task/test → revision-pinned evidence</text><text x="68" y="732" class="mono">C-core / example: acceptProposal(proposalId, expectedSpecRevision)</text><text x="68" y="762" class="small">Check actor + project + permissions + current base → one accepted revision + audit → linked artifacts need review.</text><text x="68" y="791" class="small">Basis: R-EDT-1–4 · R-ARC-3 · R-EVD-1/2 · test links required; implementation build identity here is UNKNOWN.</text><text x="68" y="828" class="small">Flat / isometric / table switches are read-only view preferences: no model call, charge, acceptance or readiness change.</text><text x="48" y="893" class="small">Own illustration · No source assets copied · SVG is editable · Prefer existing canvas/SVG/CSS and accessible 2D over a new 3D engine</text></svg>